name: Deploy & Release

on:
  push:
    branches:
      - master
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          GITHUB_ACTIONS: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Registrar Release y Tag
    needs: [build, deploy]
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Crear tag y release SemVer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          servidor="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0] // empty | "[#\(.number)](\(.html_url)) \(.title)"')

          # SemVer obtenido de package.json
          version=$(node -p "require('./package.json').version")
          base_tag="v$version"

          # Verificar si el tag base ya existe en el repo remoto
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$base_tag" >/dev/null 2>&1; then
            # Si ya existe, buscar sufijos incrementales .N para evitar colisiones
            ultimo=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$base_tag." \
              --jq '[.[].ref | capture("\\.(?<n>[0-9]+)$").n | tonumber] | max // 0')
            tag="$base_tag.$((ultimo + 1))"
          else
            tag="$base_tag"
          fi

          # Armar notas del release
          {
            echo "### 🚀 Split \`$tag\`"
            echo
            echo "**Commit:** [\`${GITHUB_SHA:0:7}\`]($servidor/commit/$GITHUB_SHA)"
            echo "**PR:** ${pr:-sin PR (merge directo)}"
            echo "**Workflow:** [#$GITHUB_RUN_NUMBER]($servidor/actions/runs/$GITHUB_RUN_ID)"
            echo
            pr_num=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty')
            if [[ -n "$pr_num" ]]; then
              body=$(gh pr view "$pr_num" --json body --jq '.body // empty' 2>/dev/null || true)
              if [[ -n "$body" ]]; then
                echo "#### Resumen del Pull Request:"
                echo "$body"
              fi
            fi
          } > notas.md

          # Publicar tag y release en GitHub
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$tag" --notes-file notas.md

          echo "Release publicada con éxito: $tag" >> "$GITHUB_STEP_SUMMARY"
          cat notas.md >> "$GITHUB_STEP_SUMMARY"
